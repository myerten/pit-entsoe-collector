name: entsoe-pit-collector

on:
  schedule:
    - cron: "*/15 * * * *"
  workflow_dispatch: {}

concurrency:
  group: collector
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install -r requirements.txt

      - name: Collect
        env:
          ENTSOE_API_KEY: ${{ secrets.ENTSOE_API_KEY }}
          COLLECTOR_ID: gha
        run: python collector.py

      - name: Commit
        run: |
          git config user.name "pit-collector"
          git config user.email "pit-collector@users.noreply.github.com"
          git add data state
          if git diff --cached --quiet; then exit 0; fi
          git commit -q -m "poll $(date -u +%Y-%m-%dT%H:%MZ)"
          for i in 1 2 3; do
            git pull -q --rebase && git push -q && exit 0
            sleep 5
          done
          exit 1
